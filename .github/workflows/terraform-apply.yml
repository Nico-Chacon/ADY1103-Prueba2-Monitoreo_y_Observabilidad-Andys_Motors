name: Terraform Apply

# Ejecucion MANUAL: GitHub > Actions > "Terraform Apply" > Run workflow.
#   plan   -> solo muestra que se crearia (no crea nada)
#   apply  -> crea la infraestructura
#   output -> muestra las IP/URLs de lo ya creado
# Para destruir: usar el workflow "Terraform Destroy".
#
# Credenciales y passwords: Settings > Secrets and variables > Actions.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Que hacer con la infraestructura"
        type: choice
        required: true
        default: apply
        options: [plan, apply, output]

# Evita dos ejecuciones simultaneas contra el mismo state.
concurrency:
  group: terraform-andys-motors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    env:
      ACCION: ${{ inputs.accion }}
      # --- Credenciales temporales del Learner Lab (cambian en cada sesion) ---
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      # --- Variables de Terraform ---
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_admin_token: ${{ secrets.ADMIN_TOKEN }}
      # true: crea la EC2 de monitoreo (con Docker listo) y las reglas de Security
      # Group para leer /metrics. Prometheus y Grafana se levantan A MANO por SSH.
      TF_VAR_enable_monitoring: "true"
      TF_VAR_topologia: ${{ vars.TOPOLOGIA || 'completa' }}
      # --- Backend remoto (bucket creado a mano con aws s3api create-bucket) ---
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'andys-motors-tfstate-chacon-ep2' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar que estan todos los secrets
        run: |
          faltan=0
          verificar() {
            if [ -z "${!1}" ]; then
              echo "::error::Falta configurar $2 en Settings > Secrets and variables > Actions"
              faltan=1
            fi
          }
          verificar AWS_ACCESS_KEY_ID             "secret AWS_ACCESS_KEY_ID"
          verificar AWS_SECRET_ACCESS_KEY         "secret AWS_SECRET_ACCESS_KEY"
          verificar AWS_SESSION_TOKEN             "secret AWS_SESSION_TOKEN"
          verificar TF_VAR_admin_cidr             "secret ADMIN_CIDR"
          verificar TF_VAR_db_password            "secret DB_PASSWORD"
          verificar TF_VAR_grafana_admin_password "secret GRAFANA_ADMIN_PASSWORD"
          verificar TF_VAR_admin_token            "secret ADMIN_TOKEN"
          exit $faltan

      # Finales de linea de Windows (CRLF) rompen los scripts de arranque.
      - name: Normalizar finales de linea (CRLF a LF)
        run: |
          find .. -type f \
            \( -name '*.sh' -o -name '*.tftpl' -o -name '*.tf' -o -name '*.py' \
               -o -name '*.js' -o -name '*.yml' -o -name '*.cfg' -o -name '*.sql' \
               -o -name '*.html' -o -name 'Dockerfile' \) \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -exec sed -i 's/\r$//' {} +

      - name: Comprobar credenciales del lab
        run: |
          if aws sts get-caller-identity --query Account --output text > /dev/null; then
            echo "Credenciales AWS validas"
          else
            echo "::error::Credenciales vencidas o mal copiadas. Actualiza los 3 secrets AWS_* con AWS Details > AWS CLI."
            exit 1
          fi

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      # Si el bucket del state ya existe (lo creaste a mano) no hace nada.
      - name: Verificar / crear el bucket del state
        run: |
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "El bucket del state ya existe: $TF_STATE_BUCKET"
          else
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled || true
            echo "Bucket del state creado: $TF_STATE_BUCKET"
          fi

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        if: env.ACCION == 'plan' || env.ACCION == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        if: env.ACCION == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs en el resumen de la ejecucion
        if: env.ACCION == 'apply' || env.ACCION == 'output'
        run: |
          {
            echo "## Outputs de Terraform"
            echo
            echo '```'
            terraform output -no-color
            echo '```'
            echo
            echo "El arranque de cada servidor toma entre 3 y 6 minutos."
          } >> "$GITHUB_STEP_SUMMARY"
