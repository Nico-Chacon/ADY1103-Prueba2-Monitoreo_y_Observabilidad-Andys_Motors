name: Terraform Destroy

# Ejecucion MANUAL. Destruye TODA la infraestructura creada por Terraform Apply
# (las 8 EC2, security groups y el bucket de documentos).
# NO borra el bucket del state (se creo a mano, fuera de Terraform).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "destruir" para confirmar'
        type: string
        required: true

concurrency:
  group: terraform-andys-motors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    if: inputs.confirmar == 'destruir'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      # Terraform exige las variables aunque sea para destruir.
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_admin_token: ${{ secrets.ADMIN_TOKEN }}
      TF_VAR_enable_monitoring: "true"
      TF_VAR_topologia: ${{ vars.TOPOLOGIA || 'completa' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'andys-motors-tfstate-chacon-ep2' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Normalizar finales de linea (CRLF a LF)
        run: |
          find .. -type f \
            \( -name '*.sh' -o -name '*.tftpl' -o -name '*.tf' -o -name '*.py' \
               -o -name '*.js' -o -name '*.yml' -o -name '*.cfg' -o -name '*.sql' \
               -o -name '*.html' -o -name 'Dockerfile' \) \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -exec sed -i 's/\r$//' {} +

      - name: Comprobar credenciales del lab
        run: |
          aws sts get-caller-identity --query Account --output text > /dev/null \
            || { echo "::error::Credenciales vencidas. Actualiza los 3 secrets AWS_*."; exit 1; }

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve
