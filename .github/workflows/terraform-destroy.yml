name: "Terraform Destroy"

# FASES DEL RETIRO DEL ENTORNO
#   Fase 1  Preparacion (credenciales y state)
#   Fase 2  Terraform destroy (o limpieza por etiquetas si el state se perdio)
#   Fase 3  Confirmacion de que no quedaron instancias activas

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Escribe "yes" para confirmar la destruccion de la infraestructura'
        required: true
        type: string

concurrency:
  group: terraform-andysmotors
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PROJECT_NAME: andys-motors
  AWS_REGION: us-east-1
  # Terraform exige las variables obligatorias tambien para destruir.
  TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  TF_VAR_admin_token: ${{ secrets.ADMIN_TOKEN || 'andys-lab' }}
  TF_VAR_key_name: vockey
  TF_VAR_enable_monitoring: "true"
  TF_VAR_demo_repo_url: ${{ vars.DEMO_REPO_URL || 'https://github.com/asanchezo-duoc/ADY1103-Activities' }}
  TF_VAR_demo_repo_ref: ${{ vars.DEMO_REPO_REF || 'main' }}
  TF_VAR_demo_repo_subdir: ${{ vars.DEMO_REPO_SUBDIR || 'Casos/AndysMotors/demo' }}

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.confirm_destroy == 'yes'
    defaults:
      run:
        shell: bash

    steps:
      # ======================= FASE 1: PREPARACION ========================
      - name: "[F1] Checkout"
        uses: actions/checkout@v4

      - name: "[F1] Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: "[F1] Configure AWS Credentials (AWS Academy Learner Lab)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: "[F1] Verificar credenciales vigentes"
        run: |
          aws sts get-caller-identity || { echo "::error::Credenciales vencidas: actualiza los secrets AWS_* desde AWS Details."; exit 1; }

      - name: "[F1] Restaurar state de la ejecucion anterior"
        id: state
        uses: ./.github/actions/restaurar-state
        with:
          token: ${{ github.token }}

      # ======================= FASE 2: DESTROY ============================
      - name: "[F2] Terraform Init"
        if: steps.state.outputs.restaurado == 'true'
        working-directory: ./infra
        run: terraform init -input=false

      - name: "[F2] Terraform Destroy"
        id: destroy
        if: steps.state.outputs.restaurado == 'true'
        working-directory: ./infra
        run: |
          # Se usa la misma topologia con la que se desplego.
          export TF_VAR_topologia="$(cat topologia.txt 2>/dev/null || echo completa)"
          echo "Topologia del state: $TF_VAR_topologia"
          terraform destroy -input=false -auto-approve

      - name: "[F2] Plan B: limpieza por etiquetas (no habia state)"
        if: steps.state.outputs.restaurado != 'true'
        run: |
          echo "::warning::No se encontro state previo. Se eliminan los recursos buscandolos por la etiqueta Proyecto=${PROJECT_NAME}."
          bash scripts/ci/limpieza-por-etiquetas.sh

      # El state vacio tambien se sube: asi el proximo apply parte de cero.
      - name: "[F2] Subir state posterior al destroy"
        if: always() && steps.state.outputs.restaurado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfstate
          path: |
            infra/terraform.tfstate
          retention-days: 90
          if-no-files-found: ignore

      # ================== FASE 3: CONFIRMACION ============================
      - name: "[F3] Confirmar que no quedaron instancias del proyecto"
        if: always()
        run: |
          RESTAN=$(aws ec2 describe-instances \
            --filters "Name=tag:Proyecto,Values=${PROJECT_NAME}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text | wc -w)
          echo "Instancias del proyecto que siguen activas: $RESTAN"
          {
            echo "## Destroy finalizado"
            echo "Instancias restantes del proyecto: **$RESTAN**"
            echo "Revisa igualmente EC2 > Volumes por si quedo algun EBS suelto."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$RESTAN" == "0" ]]
